project:
  type: book
  output-dir: docs
  resources:
    - htmls/
    - labs/

book:
  title: "Foundations of Probability and Statistical Theory"
  subtitle: "A Modern Introduction with Computation, Simulation, and Inference"
  author: "He Wang"
  date: "2026"
  site-url: "https://wanghemath.github.io/Book-ProbabilityStatisticalTheory/"
  repo-url: "https://github.com/wanghemath/Book-ProbabilityStatisticalTheory"
  repo-actions:
    - edit
    - issue

  chapters:
    - index.qmd
    - introduction.qmd
    - labs-summary.qmd
    - chapters/chapter-01-basic-probability.qmd
    - chapters/chapter-02-random-variables-distributions.qmd
    - chapters/chapter-03-joint-conditional-probability.qmd
    - chapters/chapter-04-expectations-moments-mgf.qmd
    - chapters/chapter-05-transformations.qmd
    - chapters/chapter-06-conditional-expectations.qmd
    - chapters/chapter-06-extra-multinomial-multinormal.qmd
    - chapters/chapter-07-inequalities-identities.qmd
    - chapters/chapter-08-sampling-order-statistics.qmd
    - chapters/chapter-09-convergence-theory.qmd
    - chapters/chapter-10-monte-carlo-sampling.qmd
    - chapters/chapter-11-sufficient-statistics.qmd
    - chapters/chapter-12-point-estimation1.qmd
    - chapters/chapter-13-point-estimation2.qmd
    - chapters/chapter-14-hypothesis-tests1.qmd
    - chapters/chapter-15-hypothesis-tests2.qmd
    - chapters/chapter-16-interval-estimation1.qmd
    - chapters/chapter-17-interval-estimation2.qmd
    - chapters/chapter-18-anova1.qmd
    - chapters/chapter-19-anova2-applications.qmd
    - chapters/chapter-20-bayesian-inference.qmd
    - references.qmd

  sidebar:
    style: docked
    background: light

  page-footer:
    left: "Foundations of Probability and Statistical Theory"
    right: "Built with Quarto"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: show
    code-tools: true
    embed-resources: false
    link-external-newwindow: true
    smooth-scroll: true
    css: assets/styles.css

  pdf:
    pdf-engine: lualatex
    documentclass: scrreprt
    toc: true
    number-sections: true

execute:
  freeze: auto
  warning: false
  message: false

jupyter: python3
